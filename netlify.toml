[build]
  publish = "public"

# Replace with your backend URL if it changes. /api keeps the browser same-origin.
[[redirects]]
  from = "/api/*"
  to = "https://kiddocode.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
